<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تتبع شحنتك – ألوان سمائية</title>
    <!-- خط Tajawal من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 20% 30%, #e0f7fa, #b2ebf2 40%, #80deea 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* خلفية زخرفية */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            filter: blur(80px);
            top: -50px;
            left: -50px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            filter: blur(70px);
            bottom: -30px;
            right: -30px;
            z-index: 0;
        }

        .track-container {
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 2;
            animation: fadeSlideUp 0.6s ease-out;
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* بطاقة زجاجية */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 30px 50px rgba(0, 100, 120, 0.15),
                        0 10px 25px rgba(0,0,0,0.05),
                        inset 0 1px 0 rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.6);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 35px 55px rgba(0, 100, 120, 0.2),
                        0 15px 30px rgba(0,0,0,0.08);
            transform: translateY(-2px);
        }

        /* رأس البطاقة بتدرج ناعم */
        .card-header {
            background: linear-gradient(135deg, #006064, #0097a7);
            padding: 22px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-header::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            top: -50px;
            right: -30px;
        }

        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }

        .card-header p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.9);
            margin-top: 6px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* منطقة البحث */
        .search-area {
            padding: 24px 20px 12px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 5px;
            border: 1px solid rgba(0,150,136,0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .input-group input {
            flex: 2;
            border: none;
            background: transparent;
            padding: 12px 16px;
            font-size: 0.95rem;
            text-align: center;
            color: #004d40;
            font-weight: 600;
            outline: none;
            border-radius: 60px;
            transition: 0.2s;
        }

        .input-group input::placeholder {
            color: #80cbc4;
            font-weight: 400;
        }

        .input-group input:focus {
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 0 3px rgba(0,150,136,0.15);
        }

        .input-group button {
            background: linear-gradient(135deg, #0097a7, #006064);
            border: none;
            padding: 0 28px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 15px rgba(0,137,123,0.2);
            white-space: nowrap;
        }

        .input-group button:hover {
            background: linear-gradient(135deg, #00838f, #004d40);
            transform: scale(1.02);
            box-shadow: 0 12px 20px rgba(0,137,123,0.3);
        }

        .input-group button:active {
            transform: scale(0.97);
        }

        .example-hint {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 10px;
            color: #00838f;
            font-weight: 600;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(5px);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            margin-right: auto;
            margin-left: auto;
            width: fit-content;
        }

        /* عرض النتائج */
        .status-stepper {
            padding: 16px 20px 24px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stepper-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #00695c;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.8);
            padding: 6px 16px;
            border-radius: 30px;
            display: inline-block;
            margin-right: auto;
            margin-left: auto;
            width: fit-content;
        }

        .vertical-steps {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .step-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,150,136,0.15);
            border-radius: 24px;
            padding: 14px 18px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .step-card:hover {
            transform: translateX(-4px);
            box-shadow: 0 8px 20px rgba(0,150,136,0.1);
        }

        .step-icon {
            width: 44px;
            height: 44px;
            background: #e0f2f1;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #00796b;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .step-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2c3e50;
            flex: 1;
        }

        /* المرحلة النشطة */
        .step-card.active {
            background: linear-gradient(105deg, #e0f7fa, #b2dfdb);
            border-color: #26a69a;
            box-shadow: 0 8px 18px rgba(0,150,136,0.15);
            transform: scale(1.02);
        }

        .step-card.active .step-icon {
            background: #009688;
            color: white;
            box-shadow: 0 6px 15px rgba(0,150,136,0.3);
        }

        .step-card.active .step-label {
            color: #004d40;
            font-weight: 800;
        }

        /* المرحلة غير النشطة */
        .step-card.inactive {
            background: rgba(255,255,255,0.5);
            border-color: rgba(0,0,0,0.05);
        }

        .step-card.inactive .step-icon {
            background: #eceff1;
            color: #90a4ae;
        }

        .step-card.inactive .step-label {
            color: #78909c;
        }

        /* رسالة الخطأ */
        .error-message {
            color: #c62828;
            background: rgba(255,235,238,0.8);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            padding: 14px 18px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: 600;
            border: 1px solid rgba(239,83,80,0.2);
            box-shadow: 0 4px 10px rgba(239,83,80,0.1);
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-2px); }
            80% { transform: translateX(2px); }
        }

        /* تذييل البطاقة */
        footer {
            text-align: center;
            padding: 14px;
            font-size: 0.7rem;
            background: rgba(224,242,241,0.7);
            backdrop-filter: blur(5px);
            color: #00695c;
            font-weight: 600;
            border-top: 1px solid rgba(255,255,255,0.8);
        }

        /* تحسينات للجوال */
        @media (max-width: 480px) {
            .card-header h1 {
                font-size: 1.5rem;
            }
            .step-icon {
                width: 36px;
                height: 36px;
                font-size: 1.3rem;
                border-radius: 16px;
            }
            .step-label {
                font-size: 0.78rem;
            }
            .step-card {
                padding: 12px 14px;
                gap: 12px;
            }
            .input-group button {
                padding: 0 18px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
<div class="track-container">
    <div class="card">
        <div class="card-header">
            <h1>📦 تتبع شحنتك</h1>
            <p>ألوان سمائية – تتبع فوري لطلبك</p>
        </div>
        <div class="search-area">
            <div class="input-group">
                <input type="text" id="trackingNumber" placeholder="مثال: 0001" autocomplete="off">
                <button id="trackBtn"><span>🔍</span> تتبع</button>
            </div>
            <div class="example-hint">📋 جرّب رقم الطلب: 0001</div>
        </div>

        <div id="resultDynamic" style="display: none;">
            <div class="status-stepper">
                <div class="stepper-title">🚚 مراحل الشحن</div>
                <div class="vertical-steps" id="stepsContainer"></div>
            </div>
        </div>
        <div id="errorArea" style="display: none; padding: 0 20px 20px;">
            <div class="error-message" id="errorMsg">⚠️ الطلب غير موجود</div>
        </div>
        <footer>⚡ تتبع مباشر من Firebase</footer>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDXY2aKmzbKqxs2EmMiMAZ-_5qatDLiXZQ",
        authDomain: "alipay-5f8b3.firebaseapp.com",
        databaseURL: "https://alipay-5f8b3-default-rtdb.firebaseio.com",
        projectId: "alipay-5f8b3",
        storageBucket: "alipay-5f8b3.firebasestorage.app",
        messagingSenderId: "89272268",
        appId: "1:89272268:web:6f4c4fca444f2898cc7769",
        measurementId: "G-YHXXK6ZKXC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ALL_STATUSES = [
        "جاري المعالجة",
        "جاري التجهيز",
        "قيد الشحن الى الامارات",
        "قيد الشحن الى العراق",
        "تم الاستلام في البصرة",
        "جاري الشحن لمخازننا في الناصرية",
        "وصلت شحنتك بنجاح"
    ];

    const STATUS_ICONS = {
        "جاري المعالجة": "⚙️",
        "جاري التجهيز": "📦",
        "قيد الشحن الى الامارات": "✈️",
        "قيد الشحن الى العراق": "🚛",
        "تم الاستلام في البصرة": "✅",
        "جاري الشحن لمخازننا في الناصرية": "🏭",
        "وصلت شحنتك بنجاح": "🎉"
    };

    const trackInput = document.getElementById('trackingNumber');
    const trackBtn = document.getElementById('trackBtn');
    const resultDiv = document.getElementById('resultDynamic');
    const errorDiv = document.getElementById('errorArea');
    const stepsContainer = document.getElementById('stepsContainer');

    function renderAllStages(currentStatus) {
        stepsContainer.innerHTML = '';
        ALL_STATUSES.forEach(status => {
            const isActive = (status === currentStatus);
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step-card';
            stepDiv.classList.add(isActive ? 'active' : 'inactive');
            stepDiv.innerHTML = `
                <div class="step-icon">${STATUS_ICONS[status] || '📌'}</div>
                <div class="step-label">${status}</div>
            `;
            stepsContainer.appendChild(stepDiv);
        });
    }

    async function trackOrder() {
        let orderId = trackInput.value.trim();
        if (!orderId) {
            alert("الرجاء إدخال رقم التتبع");
            return;
        }
        resultDiv.style.display = 'none';
        errorDiv.style.display = 'none';
        resultDiv.style.display = 'block';
        stepsContainer.innerHTML = '<div class="step-card" style="justify-content:center;"><span style="color:#0097a7;">⏳ جاري البحث...</span></div>';

        try {
            const snapshot = await get(ref(db, `orders/${orderId}`));
            if (snapshot.exists()) {
                const currentStatus = snapshot.val().status || "جاري المعالجة";
                renderAllStages(currentStatus);
                errorDiv.style.display = 'none';
            } else {
                resultDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                document.getElementById('errorMsg').innerHTML = `❌ لا يوجد طلب برقم "${orderId}"`;
            }
        } catch (err) {
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'block';
            document.getElementById('errorMsg').innerHTML = `⚠️ خطأ في الاتصال: ${err.message}`;
        }
    }

    trackBtn.addEventListener('click', trackOrder);
    trackInput.addEventListener('keypress', (e) => e.key === 'Enter' && trackOrder());
</script>
</body>
</html>
